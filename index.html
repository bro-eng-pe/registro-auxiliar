<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Auxiliar</title>
<meta name="description" content="Registro auxiliar de Inglés por competencias: asistencia, fichas de cotejo, rúbricas, conducta y notas para SIAGIE.">
<meta name="theme-color" content="#1e5a50">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Pizarra y tiza: verde pizarra, niveles CNEB con color propio, cabecera fija. */
:root {
  --fondo: #eef2ef; --sup: #ffffff; --sup2: #f5f8f6; --tinta: #17221f; --suave: #4b5a55; --tenue: #7a8984;
  --linea: #dce5e1; --linea2: #cfdad5; --acento: #1e5a50; --acento-osc: #123a33; --acento-sv: #d9e8e3; --sobre-acento: #ffffff;
  --azul: #1d3f8f; --aviso: #fff4e0; --aviso-t: #5c3a00; --peligro: #b3400b; --peligro-sv: #fdece4; --just: #fff8ea;
  --ad: #1d3f8f; --ad-t: #ffffff; --a: #2f7d4f; --a-t: #ffffff; --b: #e8a33a; --b-t: #17221f; --c: #c2410c; --c-t: #ffffff;
  --b-sv: #fbe3b8; --b-svt: #5c3a00; --tarde: #6b4fa1; --sombra: 0 12px 40px rgba(20, 40, 35, .22);
  --r: 14px; --fuente: 'Atkinson Hyperlegible', system-ui, sans-serif; --titulo: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #101816; --sup: #18221f; --sup2: #1d2926; --tinta: #e6eeeb; --suave: #a9b8b3; --tenue: #7f8f8a;
    --linea: #2a3834; --linea2: #344541; --acento: #2f7d6d; --acento-osc: #0d2a25; --acento-sv: #1f3a34; --sobre-acento: #ffffff;
    --aviso: #3a2c12; --aviso-t: #f3d9a6; --peligro: #f08a5d; --peligro-sv: #3a2219; --just: #2e2714; --b-sv: #4a3a17; --b-svt: #f3d9a6; --tarde: #8f74cc;
    --sombra: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #101816; --sup: #18221f; --sup2: #1d2926; --tinta: #e6eeeb; --suave: #a9b8b3; --tenue: #7f8f8a;
  --linea: #2a3834; --linea2: #344541; --acento: #2f7d6d; --acento-osc: #0d2a25; --acento-sv: #1f3a34; --sobre-acento: #ffffff;
  --aviso: #3a2c12; --aviso-t: #f3d9a6; --peligro: #f08a5d; --peligro-sv: #3a2219; --just: #2e2714; --b-sv: #4a3a17; --b-svt: #f3d9a6; --tarde: #8f74cc;
  --sombra: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--fuente); font-size: 16px; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
a { color: var(--acento); }
h1, h2, h3 { font-family: var(--titulo); margin: 0; line-height: 1.15; }
:focus-visible { outline: 3px solid #e8a33a; outline-offset: 2px; }
.oculto { position: absolute !important; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ---------- Cabecera fija ---------- */
.cab { position: sticky; top: 0; z-index: 30; background: var(--acento); color: var(--sobre-acento); min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-left)); flex-wrap: wrap; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.cab.azul { background: var(--azul); }
.cab-tit { display: flex; flex-direction: column; min-width: 0; }
.cab-tit b { font-family: var(--titulo); font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab-tit span { font-size: 14px; opacity: .85; }
.cab .esp { flex: 1; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #fff; color: #1e5a50; display: flex; align-items: center; justify-content: center; font-family: var(--titulo); font-weight: 700; flex-shrink: 0; }
.btn-ico { width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(0,0,0,.22); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.estado { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,.25); padding: 7px 12px; border-radius: 999px; font-size: 14px; border: 0; color: #fff; max-width: 100%; }
.estado i { width: 10px; height: 10px; border-radius: 50%; background: #7fd6a8; flex-shrink: 0; }
.estado.offline i, .estado.sync i { background: #e8a33a; } .estado.error i { background: #ff8a65; } .estado.local i { background: #c9d1ce; }
.cab .inp { color: #17221f; background: #fff; border-color: #fff; }
.estado .corto { display: none; }
@media (max-width: 600px) { .estado .largo { display: none; } .estado .corto { display: inline; } .cab { gap: 8px; } }
.cab .btn-claro { height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #fff; color: #1e5a50; font-weight: 700; }
.cab .btn-borde { height: 44px; padding: 0 14px; border: 1px solid rgba(255,255,255,.55); border-radius: 10px; background: transparent; color: #fff; }

/* ---------- Estructura ---------- */
.pag { max-width: 1400px; margin: 0 auto; padding: 24px 16px 80px; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 760px) { .pag { padding: 28px 32px 80px; } }
.sub { background: var(--sup); border-bottom: 1px solid var(--linea); position: sticky; top: 64px; z-index: 20; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 16px; max-width: 1400px; margin: 0 auto; scrollbar-width: none; }
.tabs a, .tabs button { flex-shrink: 0; padding: 15px 14px 12px; font-weight: 700; text-decoration: none; color: var(--suave); border: 0; background: none; border-bottom: 3px solid transparent; font-size: 15px; }
.tabs .act { color: var(--acento); border-bottom-color: var(--acento); }
:root[data-theme="dark"] .tabs .act { color: #7fd6b8; border-bottom-color: #7fd6b8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs .act { color: #7fd6b8; border-bottom-color: #7fd6b8; } }
.tarjeta { background: var(--sup); border-radius: 18px; padding: 20px; }
.tarjeta.borde { border: 2px solid var(--linea); }
.fila { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.titulo-pag { font-size: 30px; }
.muted { color: var(--suave); }
.peq { font-size: 14px; }
.grid-aulas { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.aula-btn { min-height: 190px; border: 0; border-radius: 20px; background: var(--sup); box-shadow: inset 0 0 0 2px var(--linea); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 20px; text-align: left; }
.aula-btn .cod { font-family: var(--titulo); font-size: 60px; font-weight: 700; line-height: 1; color: var(--acento); }
:root[data-theme="dark"] .aula-btn .cod { color: #7fd6b8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .aula-btn .cod { color: #7fd6b8; } }
.aula-btn .al { font-size: 14px; font-weight: 700; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.btn-grande { min-height: 112px; border: 0; border-radius: 20px; display: flex; align-items: center; gap: 18px; padding: 18px 24px; text-align: left; }
.btn-grande b { display: block; font-family: var(--titulo); font-size: 22px; }
.btn-grande span span { font-size: 15px; opacity: .9; }
.mosaico { color: var(--tinta); min-height: 160px; border: 0; border-radius: 20px; background: var(--sup); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 22px; text-align: left; box-shadow: inset 0 0 0 2px var(--linea); }
.mosaico .k { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .8; }
.mosaico b { font-family: var(--titulo); font-size: 26px; display: block; margin-bottom: 4px; }
.mosaico .d { font-size: 15px; line-height: 1.4; opacity: .9; }
.mosaico.prim { background: var(--acento); color: #fff; box-shadow: none; }
.mosaico.avi { background: var(--aviso); color: var(--aviso-t); box-shadow: none; }

/* ---------- Botones y campos ---------- */
.btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--acento); background: var(--sup); color: var(--acento); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
:root[data-theme="dark"] .btn { color: #9fe0c9; border-color: #3f8f7c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #9fe0c9; border-color: #3f8f7c; } }
.btn.prim { background: var(--acento); color: #fff; border-color: var(--acento); }
.btn.azul { background: var(--azul); border-color: var(--azul); color: #fff; }
.btn.peligro { border-color: var(--peligro); color: var(--peligro); }
.btn.peligro.lleno { background: #c2410c; border-color: #c2410c; color: #fff; }
.btn.chico { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn.punteado { border-style: dashed; }
.btn:disabled { opacity: .45; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo label, .etq { font-size: 14px; font-weight: 700; }
.inp { min-height: 50px; border: 2px solid var(--linea2); border-radius: 12px; padding: 0 14px; background: var(--sup); font-size: 17px; width: 100%; }
textarea.inp { padding: 10px 14px; min-height: 96px; resize: vertical; }
.inp:focus { border-color: var(--acento); outline: none; }
select.inp { padding-right: 8px; }

/* ---------- Niveles ---------- */
.lv { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 30px; border-radius: 7px; font-weight: 700; font-size: 14px; padding: 0 6px; }
.lv-AD { background: var(--ad); color: var(--ad-t); } .lv-A { background: var(--a); color: var(--a-t); }
.lv-B { background: var(--b); color: var(--b-t); } .lv-C { background: var(--c); color: var(--c-t); }
.lv-0 { background: var(--sup2); color: var(--tenue); box-shadow: inset 0 0 0 1px var(--linea); }
.lv.suave.lv-B { background: var(--b-sv); color: var(--b-svt); }
.leyenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--suave); align-items: center; }
.leyenda span { display: inline-flex; gap: 6px; align-items: center; }
.leyenda i { width: 20px; height: 14px; border-radius: 4px; display: inline-block; }

/* ---------- Segmentados ---------- */
.seg { display: inline-flex; border: 1px solid var(--linea2); border-radius: 10px; overflow: hidden; background: var(--sup); flex-shrink: 0; }
.seg button { min-height: 44px; min-width: 50px; border: 0; background: transparent; font-weight: 700; color: var(--suave); padding: 0 10px; }
.seg button + button { border-left: 1px solid var(--linea); }
.seg .on-P { background: var(--acento); color: #fff; } .seg .on-T { background: var(--tarde); color: #fff; } .seg .on-F { background: #c2410c; color: #fff; } .seg .on-J { background: #e8a33a; color: #17221f; }
.seg .on-S { background: var(--a); color: #fff; } .seg .on-N { background: var(--c); color: #fff; }
.seg .on-AD { background: var(--ad); color: #fff; } .seg .on-A { background: var(--a); color: #fff; } .seg .on-B { background: var(--b); color: #17221f; } .seg .on-C { background: var(--c); color: #fff; }
.seg.mini button { min-height: 40px; min-width: 40px; font-size: 14px; }

/* ---------- Tablas de registro ---------- */
.tabla-caja { background: var(--sup); border-radius: 16px; overflow: auto; max-height: calc(100vh - 230px); -webkit-overflow-scrolling: touch; }
table.reg { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
table.reg th, table.reg td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--linea); white-space: nowrap; }
table.reg thead th { position: sticky; top: 0; background: var(--sup); z-index: 2; font-size: 11px; color: var(--suave); font-weight: 700; line-height: 1.2; white-space: normal; min-width: 54px; vertical-align: bottom; }
table.reg thead tr:nth-child(2) th { top: 31px; }
table.reg thead th.grupo { font-size: 13px; color: var(--acento); border-bottom: 2px solid var(--acento); text-align: left; padding-left: 6px; }
table.reg th.nom, table.reg td.nom { position: sticky; left: 0; background: var(--sup); z-index: 1; text-align: left; min-width: 190px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; font-weight: 700; padding-left: 12px; }
table.reg thead th.nom { z-index: 3; }
table.reg td.num, table.reg th.num { color: var(--suave); width: 34px; min-width: 34px; }
table.reg td.compcol .lv { box-shadow: 0 0 0 2px var(--tinta); }
table.reg tr:hover td { background: var(--sup2); }
table.reg td .lv { min-width: 44px; height: 28px; }
.celda-btn { border: 0; background: none; padding: 0; }

/* ---------- Ficha / rúbrica ---------- */
.cabficha { background: var(--sup2); border-bottom: 2px solid var(--acento); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.cabficha .g { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.cabficha .g2 { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.fld { display: flex; flex-direction: column; gap: 2px; background: var(--sup); border: 1px solid var(--linea2); border-radius: 10px; padding: 7px 12px; min-width: 0; text-align: left; min-height: 52px; justify-content: center; }
button.fld { cursor: pointer; } button.fld:hover { border-color: var(--acento); }
.fld .fl { font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
.fld .fv { font-size: 15px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fld.vacio .fv { color: var(--tenue); }
.fld.req { border: 2px solid var(--acento); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--sup); border: 1px solid var(--linea2); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.ficha-lista { display: flex; flex-direction: column; }
.frow { display: grid; grid-template-columns: 34px minmax(170px, 1fr) auto auto 56px 44px; gap: 10px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--linea); background: var(--sup); }
.frow:nth-child(even) { background: var(--sup2); }
.frow.cab-row { position: sticky; top: 64px; z-index: 5; background: var(--sup); font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; padding-top: 10px; padding-bottom: 10px; }
.frow.just { background: var(--just); }
.frow.cond { background: var(--peligro-sv); }
.frow .fn { display: flex; flex-direction: column; min-width: 0; }
.frow .fn b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .fn small { font-size: 12px; font-weight: 700; color: var(--aviso-t); }
.frow .fn small.rojo { color: var(--peligro); }
.fcrits { display: flex; gap: 8px; }
.fcrit { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.fcrit .cl { display: none; }
.fpart { display: flex; align-items: center; gap: 4px; }
.fpart .pbtn { min-width: 40px; height: 40px; border: 0; border-radius: 8px; font-weight: 700; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: var(--sup2); color: var(--suave); box-shadow: inset 0 0 0 1px var(--linea2); }
.fpart .pbtn small { font-size: 10px; margin-top: 2px; }
.fpart .pbtn.tiene-AD { background: var(--ad); color: #fff; box-shadow: none; } .fpart .pbtn.tiene-A { background: var(--a); color: #fff; box-shadow: none; }
.fpart .pbtn.tiene-B { background: var(--b); color: #17221f; box-shadow: none; } .fpart .pbtn.tiene-C { background: var(--c); color: #fff; box-shadow: none; }
.fpart .ptot { min-width: 34px; text-align: center; font-weight: 700; font-size: 15px; }
.fpart .ptot.bast { color: var(--acento); }
.fpart .menos { width: 34px; height: 40px; border: 1px solid var(--linea2); border-radius: 8px; background: var(--sup); font-size: 18px; color: var(--suave); }
.bloqueo { grid-column: 3 / 5; display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--aviso-t); }
.obs-btn { width: 44px; height: 40px; border: 1px solid var(--linea2); border-radius: 8px; background: var(--sup); display: flex; align-items: center; justify-content: center; }
.obs-btn.tiene { background: var(--acento-sv); border-color: var(--acento); }
/* Modo tarjetas (tableta vertical o elegido en Ajustes › Apariencia) */
html.modo-tarjetas .frow { grid-template-columns: 1fr auto; padding: 14px 16px; gap: 10px; border-radius: 16px; margin: 0 12px 12px; border: 2px solid var(--linea); }
html.modo-tarjetas .frow:nth-child(even) { background: var(--sup); }
html.modo-tarjetas .frow.cab-row { display: none; }
html.modo-tarjetas .frow .fnum { display: none; }
html.modo-tarjetas .frow .fn { grid-column: 1 / 2; }
html.modo-tarjetas .frow .fres { grid-column: 2 / 3; grid-row: 1; justify-self: end; }
html.modo-tarjetas .fcrits { grid-column: 1 / -1; flex-direction: column; gap: 8px; }
html.modo-tarjetas .fcrit { width: auto !important; flex-direction: row; justify-content: space-between; gap: 10px; align-items: center; }
html.modo-tarjetas .fcrit .cl { display: block; font-size: 14px; line-height: 1.3; flex: 1; }
html.modo-tarjetas .fpart { grid-column: 1 / 2; flex-wrap: wrap; border-top: 1px solid var(--linea); padding-top: 10px; }
html.modo-tarjetas .frow .obs-btn { grid-column: 2 / 3; justify-self: end; align-self: end; }
html.modo-tarjetas .bloqueo { grid-column: 1 / -1; }
html.modo-tarjetas .ficha-lista { padding-top: 12px; }

html.modo-tarjetas .frow.just { background: var(--just); }
html.modo-tarjetas .frow.cond { background: var(--peligro-sv); }

/* ---------- Botones de fecha ---------- */
.grid-fechas { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.fecha-btn { min-height: 96px; border-radius: 16px; border: 2px solid var(--acento); background: var(--sup); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 16px; text-align: left; }
.fecha-btn b { font-family: var(--titulo); font-size: 22px; }
.fecha-btn span { font-size: 14px; opacity: .9; }
.fecha-btn.hoy { background: var(--acento); color: #fff; }
.fecha-btn.hoy2 { background: #2f7466; border-color: #2f7466; color: #fff; }
.fecha-btn.bloq { background: var(--linea); border-color: var(--linea); color: var(--suave); }
.fecha-btn.usada-hoy { box-shadow: 0 0 0 3px #e8a33a; }

/* ---------- Listas ---------- */
.lista { display: flex; flex-direction: column; gap: 8px; }
.item { min-height: 62px; border: 0; border-radius: 14px; background: var(--sup); display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-align: left; width: 100%; }
.item.sel { background: var(--acento-sv); }
.ini { width: 42px; height: 42px; border-radius: 50%; background: var(--acento-sv); color: var(--acento); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.item .tx { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item .tx b { font-size: 17px; }
.item .tx span { font-size: 14px; color: var(--suave); }
.etiqueta { font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: var(--b-sv); color: var(--b-svt); white-space: nowrap; }
.etiqueta.roja { background: #c2410c; color: #fff; }
.etiqueta.verde { background: var(--acento-sv); color: var(--acento); }
.buscador { display: flex; align-items: center; gap: 10px; background: var(--sup); border-radius: 14px; min-height: 58px; padding: 0 14px; border: 2px solid var(--linea2); }
.buscador:focus-within { border-color: var(--acento); }
.buscador input { flex: 1; border: 0; background: transparent; font-size: 19px; outline: none; min-width: 0; min-height: 54px; }

/* ---------- Asistencia ---------- */
.asis-row { display: grid; grid-template-columns: 34px minmax(160px, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--linea); background: var(--sup); }
.asis-row.F { background: var(--peligro-sv); } .asis-row.T { box-shadow: inset 4px 0 0 var(--tarde); }
.asis-row .fn small.t { color: var(--tarde); } .asis-row.J { background: var(--just); } .asis-row.cC { box-shadow: inset 4px 0 0 #c2410c; }
.asis-row .fn small { display: block; font-size: 12px; font-weight: 700; color: var(--peligro); }
.asis-row .fn small.j { color: var(--aviso-t); }
.cond-g { display: flex; gap: 6px; align-items: center; }
@media (max-width: 640px) { .asis-row { grid-template-columns: 1fr; } .asis-row .num { display: none; } .asis-row .fila-ctrl { display: flex; gap: 10px; flex-wrap: wrap; } }

/* ---------- Modal ---------- */
.velo { position: fixed; inset: 0; background: rgba(10, 20, 18, .5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
@media (min-width: 700px) { .velo { align-items: center; padding: 24px; } }
.modal { background: var(--sup); width: 100%; max-width: 620px; max-height: 90vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: var(--sombra); }
@media (min-width: 700px) { .modal { border-radius: 20px; } }
.modal.ancho { max-width: 900px; }
.modal-cab { padding: 18px 20px 10px; display: flex; align-items: center; gap: 12px; }
.modal-cab h2 { flex: 1; font-size: 21px; }
.modal-cuerpo { padding: 6px 20px 20px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-pie { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--linea); flex-wrap: wrap; }
.opcion { min-height: 52px; border: 0; border-radius: 10px; background: transparent; padding: 10px 12px; text-align: left; display: flex; align-items: center; gap: 10px; width: 100%; font-size: 15px; }
.opcion:hover { background: var(--sup2); }
.opcion .pt { width: 10px; height: 10px; border-radius: 50%; background: var(--acento); flex-shrink: 0; }
.opcion.hecho { color: var(--tenue); } .opcion.hecho .pt { background: var(--linea2); }
.opcion.sug { background: var(--acento-sv); box-shadow: inset 0 0 0 2px var(--acento); font-weight: 700; }
.opcion.sel { background: var(--acento-sv); }
.opcion .nota-op { font-size: 12px; margin-left: auto; text-align: right; flex-shrink: 0; }
.check { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--linea2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.opcion.sel .check { background: var(--acento); border-color: var(--acento); color: #fff; }

/* ---------- Avisos ---------- */
.aviso { background: var(--aviso); color: var(--aviso-t); border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.45; }
.aviso.verde { background: var(--acento-sv); color: var(--tinta); }
.aviso.rojo { background: var(--peligro-sv); color: var(--tinta); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 520px; }
.tst { background: #17221f; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; box-shadow: var(--sombra); pointer-events: auto; }
.tst.error { background: #8f2f08; }

/* ---------- Estadísticas ---------- */
.barra { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--sup2); }
.barra span { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; min-width: 0; overflow: hidden; }
.mini-barra { width: 110px; height: 10px; border-radius: 5px; background: var(--sup2); overflow: hidden; display: flex; flex-shrink: 0; }
.mini-barra span { display: block; height: 100%; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--sup); border-radius: 14px; padding: 14px; text-align: center; }
.kpi b { display: block; font-size: 26px; color: var(--acento); font-family: var(--titulo); }
:root[data-theme="dark"] .kpi b { color: #7fd6b8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kpi b { color: #7fd6b8; } }
.kpi span { font-size: 13px; color: var(--suave); }
.calor { border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.calor td.c { width: 30px; height: 28px; border-radius: 4px; padding: 0; }
.calor td.c.f { background: #c9d1ce; } .calor td.c.cc { box-shadow: inset 0 0 0 3px var(--tinta); }
.calor td.c.v { background: var(--sup2); }
.calor th { font-size: 11px; color: var(--suave); font-weight: 700; }
.calor td.n { text-align: left; white-space: nowrap; padding-right: 8px; font-size: 13px; position: sticky; left: 0; background: var(--sup); }
.linea-tiempo { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding: 8px 0; }
.linea-tiempo span { flex: 1; border-radius: 4px 4px 0 0; min-width: 6px; }

/* ---------- Ingreso ---------- */
.ingreso { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
@media (min-width: 900px) { .ingreso { grid-template-columns: 1fr 1fr; } }
.ingreso .lado { background: #1e5a50; color: #fff; padding: 40px 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
.ingreso .lado h1 { font-size: clamp(36px, 5vw, 52px); }
.ingreso .lado p { color: #d9e8e3; font-size: 18px; line-height: 1.5; max-width: 440px; margin: 0; }
.ingreso .form { display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.ingreso form { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
.patron-btn { min-height: 72px; border: 2px dashed var(--acento); border-radius: 12px; background: var(--sup); color: var(--acento); font-weight: 700; display: flex; align-items: center; gap: 16px; padding: 12px 18px; text-align: left; }
.sep { display: flex; align-items: center; gap: 12px; color: var(--suave); font-size: 15px; }
.sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: var(--linea2); }

@media print {
  .cab, .sub, .no-imp, #toast { display: none !important; }
  body, .pag { background: #fff; color: #000; }
  .pag { padding: 0; max-width: none; }
  .tarjeta { break-inside: avoid; border: 1px solid #ccc; }
  .lv { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tabla-caja { max-height: none; overflow: visible; }
}

</style>
</head>

/* ---------- Utilidades ---------- */
function uid() {
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return Date.now().toString(36) + Array.from(a, b => b.toString(16).padStart(2, '0')).join('').slice(0, 8);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function fechaISO(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hoy() { return (window.__HOY__) || fechaISO(new Date()); }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

function fechaMedia(s) { const d = parseISO(s); return DIAS_C[d.getDay()] + ' ' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function romano(n) { return ['', 'I', 'II', 'III', 'IV'][n] || String(n); }

/* =====================================================================
   ALMACÉN: cada dato es un registro "tipo:id" con su hora de cambio (t).
   Así la tableta y la laptop se fusionan sin pisarse: gana el cambio más reciente.
   ===================================================================== */
const DB = {
  recs: new Map(),          // clave -> {t, dev, v, d}
  porTipo: new Map(),       // tipo -> Map(id -> registro)
  sucios: new Set(),        // claves pendientes de subir
  meta: {},                 // datos de este dispositivo (no se sincronizan)
  idb: null,
  oyentes: []
};

function idbAbrir() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) { res(null); return; }
    const r = indexedDB.open('registro-auxiliar', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('recs')) db.createObjectStore('recs', { keyPath: 'k' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  });
}
function idbTodo(store) {
  return new Promise(res => {
    if (!DB.idb) { res([]); return; }
    const tx = DB.idb.transaction(store, 'readonly');
    const q = tx.objectStore(store).getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => res([]);
  });
}
let _colaEscritura = new Map(); let _colaMeta = false; let _timerEscritura = null;
function idbProgramar() {
  clearTimeout(_timerEscritura);
  _timerEscritura = setTimeout(idbVaciar, 150);
}
function idbVaciar() {
  return new Promise(res => {
    if (!DB.idb) {
      // Sin IndexedDB: respaldo de emergencia en localStorage
      try { localStorage.setItem('ra-respaldo', JSON.stringify({ recs: Array.from(DB.recs.entries()), meta: DB.meta, sucios: Array.from(DB.sucios) })); } catch (e) { }
      _colaEscritura.clear(); res(); return;
    }
    const tx = DB.idb.transaction(['recs', 'meta'], 'readwrite');
    const st = tx.objectStore('recs');
    _colaEscritura.forEach((r, k) => { if (r === null) st.delete(k); else st.put(Object.assign({ k }, r)); });
    _colaEscritura = new Map();
    const mt = tx.objectStore('meta');
    mt.put({ k: 'meta', v: DB.meta });
    mt.put({ k: 'sucios', v: Array.from(DB.sucios) });
    tx.oncomplete = () => res(); tx.onerror = () => res();
  });
}
function indexar(k, r) {
  const i = k.indexOf(':'); const tipo = k.slice(0, i); const id = k.slice(i + 1);
  if (!DB.porTipo.has(tipo)) DB.porTipo.set(tipo, new Map());
  const m = DB.porTipo.get(tipo);
  if (r && !r.d) m.set(id, r); else m.delete(id);
}
async function dbIniciar() {
  DB.idb = await idbAbrir();
  let filas = await idbTodo('recs');
  const metas = await idbTodo('meta');
  if (!DB.idb) {
    try {
      const j = JSON.parse(localStorage.getItem('ra-respaldo') || 'null');
      if (j) { filas = j.recs.map(([k, r]) => Object.assign({ k }, r)); metas.push({ k: 'meta', v: j.meta }, { k: 'sucios', v: j.sucios }); }
    } catch (e) { }
  }
  filas.forEach(f => { const k = f.k; const r = { t: f.t, dev: f.dev, v: f.v, d: f.d }; DB.recs.set(k, r); indexar(k, r); });
  metas.forEach(m => { if (m.k === 'meta') DB.meta = m.v || {}; if (m.k === 'sucios') DB.sucios = new Set(m.v || []); });
  if (!DB.meta.dev) { DB.meta.dev = uid(); }
  if (!DB.meta.since) DB.meta.since = 0;
  if (!DB.meta.colaCorreo) DB.meta.colaCorreo = [];
  idbProgramar();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
}
function guardarMeta() { idbProgramar(); }

let _reloj = 0;
function ahora() { const t = Date.now(); _reloj = t > _reloj ? t : _reloj + 1; return _reloj; }

function dbGet(tipo, id) { const m = DB.porTipo.get(tipo); const r = m && m.get(id); return r ? r.v : null; }
function dbList(tipo) { const m = DB.porTipo.get(tipo); if (!m) return []; return Array.from(m.entries()).map(([id, r]) => Object.assign({ id }, r.v)); }
function dbPut(tipo, id, v) {
  const k = tipo + ':' + id; const r = { t: ahora(), dev: DB.meta.dev, v: v, d: false };
  DB.recs.set(k, r); indexar(k, r); DB.sucios.add(k); _colaEscritura.set(k, r); idbProgramar(); avisarCambio();
  return v;
}
function dbDel(tipo, id) {
  const k = tipo + ':' + id; if (!DB.recs.has(k)) return;
  const r = { t: ahora(), dev: DB.meta.dev, v: null, d: true };
  DB.recs.set(k, r); indexar(k, r); DB.sucios.add(k); _colaEscritura.set(k, r); idbProgramar(); avisarCambio();
}
function esMasNuevo(a, b) { if (!b) return true; if (a.t !== b.t) return a.t > b.t; return String(a.dev || '') > String(b.dev || ''); }
function dbFusionar(lista, marcarSucio) {
  let n = 0;
  lista.forEach(x => {
    const cur = DB.recs.get(x.k);
    const r = { t: x.t, dev: x.dev, v: x.v, d: !!x.d };
    if (esMasNuevo(r, cur)) {
      DB.recs.set(x.k, r); indexar(x.k, r); _colaEscritura.set(x.k, r);
      if (marcarSucio) DB.sucios.add(x.k); else DB.sucios.delete(x.k);
      n++;
    }
  });
  if (n) { idbProgramar(); }
  return n;
}
async function dbBorrarTodo(conservarTipos) {
  const guardar = [];
  (conservarTipos || []).forEach(t => { const m = DB.porTipo.get(t); if (m) m.forEach((r, id) => guardar.push({ k: t + ':' + id, t: r.t, dev: r.dev, v: r.v, d: false })); });
  DB.recs.clear(); DB.porTipo.clear(); DB.sucios.clear();
  if (DB.idb) await new Promise(res => { const tx = DB.idb.transaction('recs', 'readwrite'); tx.objectStore('recs').clear(); tx.oncomplete = res; tx.onerror = res; });
  _colaEscritura = new Map();
  dbFusionar(guardar, false);
  await idbVaciar();
}
function exportarTodo() {
  const recs = []; DB.recs.forEach((r, k) => recs.push({ k, t: r.t, dev: r.dev, v: r.v, d: r.d }));
  return { app: 'registro-auxiliar', version: APP_VERSION, fecha: new Date().toISOString(), recs };
}

function avisarCambio() { clearTimeout(_timerAviso); _timerAviso = setTimeout(() => DB.oyentes.forEach(f => f()), 50); }

const CFG_DEF = {

/* ---------- Bimestres ---------- */
function bimestres() {
  const out = [];
  for (let n = 1; n <= 4; n++) { const b = dbGet('bim', String(n)); out.push({ n, inicio: b && b.inicio || '', fin: b && b.fin || '', sugerido: !!(b && b.sugerido), botones: Number(b && b.botones) || MAX_BOTONES }); }
  return out;
}
function bimestreDe(fecha) {
  const bs = bimestres();
  for (const b of bs) if (b.inicio && b.fin && fecha >= b.inicio && fecha <= b.fin) return b.n;
  let ult = 0; for (const b of bs) if (b.inicio && fecha >= b.inicio) ult = b.n;
  return ult || 1;
}

/* ---------- Aulas y estudiantes ---------- */
function aulas() {

}
function aulaNombre(a) { if (typeof a === 'string') a = dbGet('aula', a) && Object.assign({ id: a }, dbGet('aula', a)); return a ? a.grado + '.° ' + a.seccion : '—'; }
function aulaCodigo(a) { if (typeof a === 'string') a = dbGet('aula', a); return a ? a.grado + a.seccion : ''; }
function nombreEst(e) { return (e.ap || '') + ', ' + (e.no || ''); }

}
function estMatriculado(e, fecha) { return (!e.ingreso || e.ingreso <= fecha) && (!e.retiro || e.retiro > fecha); }
function numeroLista(e) { const l = estudiantes(e.aulaId); return l.findIndex(x => x.id === e.id) + 1; }

/* ---------- Asistencia y conducta ---------- */
function asisClave(aulaId, fecha, estId) { return aulaId + '|' + fecha + '|' + estId; }
function asistencia(aulaId, fecha, estId) {
  const r = dbGet('asis', asisClave(aulaId, fecha, estId));

}
function setAsistencia(aulaId, fecha, estId, cambios) {
  const actual = asistencia(aulaId, fecha, estId);
  const nuevo = Object.assign({ aulaId, fecha, estId }, actual, cambios);
  dbPut('asis', asisClave(aulaId, fecha, estId), nuevo);

}

/* ---------- Citaciones ---------- */
function proximaCita(fecha) {
  const dia = Number(cfg().diaCita); const d = parseISO(fecha);
  do { d.setDate(d.getDate() + 1); } while (d.getDay() !== dia);
  return fechaISO(d);
}
function sincronizarCitacion(a) {
  const id = asisClave(a.aulaId, a.fecha, a.estId);
  const cit = dbGet('cit', id);
  if (a.cond === 'C') {
    const base = cit || { creada: Date.now(), numero: siguienteNumeroCitacion(a.aulaId, a.fecha) };
    dbPut('cit', id, Object.assign({}, base, { aulaId: a.aulaId, estId: a.estId, fecha: a.fecha, desc: a.desc || '', cita: (cit && cit.cita) || proximaCita(a.fecha) }));
  } else if (cit && !cit.enviada) {

  }
}
function siguienteNumeroCitacion(aulaId, fecha) {
  const anio = fecha.slice(0, 4);
  const n = dbList('cit').filter(c => c.aulaId === aulaId && c.fecha.slice(0, 4) === anio).length + 1;
  return anio + '-' + aulaCodigo(aulaId) + '-' + String(n).padStart(3, '0');
}
function citaciones(filtro) { return dbList('cit').filter(filtro || (() => true)).sort((a, b) => a.fecha.localeCompare(b.fecha)); }

/* ---------- Temario ---------- */
function unidadNum(u) { u = String(u || '').trim().toUpperCase(); const r = { I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6, VII: 7, VIII: 8, IX: 9, X: 10 }; return r[u] || Number(u.replace(/\D/g, '')) || 0; }
function temas(filtro) { return dbList('tema').filter(filtro || (() => true)).sort((a, b) => (a.bim - b.bim) || (unidadNum(a.unidad) - unidadNum(b.unidad)) || (a.orden || 0) - (b.orden || 0) || a.nombre.localeCompare(b.nombre)); }
function etiquetaUnidad(t) { return t.unidad ? 'Unidad ' + t.unidad : 'Sin unidad'; }
function temasDeAula(aulaId, bim) {
  const a = dbGet('aula', aulaId);
  return temas(t => String(t.grado) === String(a.grado) && (!bim || Number(t.bim) === Number(bim)));
}
function temaUsado(aulaId, temaId) { return sesiones(s => s.aulaId === aulaId && s.temaId === temaId).length > 0; }
/* Capacidad de cada criterio: un tema o ficha puede evaluar varias capacidades */
function capDe(s, i) { return (s.critCap && s.critCap[i]) || s.cap; }
function capsDe(s) { return Array.from(new Set((s.crit || []).map((_, i) => capDe(s, i)).filter(Boolean))); }
function bancoCriterios(capId, grado) {
  const set = new Map(); const g = grado == null ? null : String(grado);
  const okG = x => g == null || !x || String(x) === g;
  // primero los usados en el temario y en fichas de este grado, luego el banco
  temas(t => okG(t.grado)).forEach(t => (t.crit || []).forEach((x, i) => { if (capDe(t, i) === capId) set.set(norm(x), x); }));
  sesiones(s => !g || (dbGet('aula', s.aulaId) || {}).grado == g).forEach(s => (s.crit || []).forEach((x, i) => { if (capDe(s, i) === capId) set.set(norm(x), x); }));
  dbList('crit').filter(c => c.cap === capId && okG(c.grado)).forEach(c => { if (!set.has(norm(c.texto))) set.set(norm(c.texto), c.texto); });
  return Array.from(set.values());
}
function agregarCriterioBanco(capId, texto, grado) {
  texto = String(texto || '').trim(); if (!texto || !CAP[capId]) return false;
  const g = grado == null ? '' : String(grado);
  if (dbList('crit').some(c => c.cap === capId && norm(c.texto) === norm(texto) && String(c.grado || '') === g)) return false;
  dbPut('crit', uid(), { cap: capId, comp: CAP[capId].comp, texto, grado: g });
  return true;
}

/* ---------- Sesiones (fichas de cotejo y rúbricas) ---------- */
const MAX_BOTONES = 25;
function maxBotones(bim) { const b = dbGet('bim', String(bim)); return Math.max(1, Number(b && b.botones) || MAX_BOTONES); }
function sesiones(filtro) { return dbList('ses').filter(filtro || (() => true)).sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.n - b.n) || a.tipo.localeCompare(b.tipo)); }
function sesionesAula(aulaId, bim, tipo) { return sesiones(s => s.aulaId === aulaId && (!bim || s.bim === bim) && (!tipo || s.tipo === tipo)); }
function numeroClase(s) {
  const fechas = Array.from(new Set(sesionesAula(s.aulaId, s.bim).map(x => x.fecha))).sort();
  const i = fechas.indexOf(s.fecha) + 1;
  return String(i) + (s.n === 2 ? '-2' : '');
}
function crearSesion(aulaId, tipo, fecha) {
  fecha = fecha || hoy();
  const bim = bimestreDe(fecha);
  const delDia = sesionesAula(aulaId, bim, tipo).filter(s => s.fecha === fecha);
  if (delDia.length >= 2) return null;
  const id = uid();
  dbPut('ses', id, { aulaId, tipo, fecha, bim, n: delDia.length + 1, temaId: '', proposito: '', producto: '', comp: '', cap: '', crit: [], creada: Date.now() });
  return id;
}
function nota(sesId, estId) { return Object.assign({ c: [], p: [], obs: '', rec: false }, dbGet('nota', sesId + '|' + estId) || {}); }
function setNota(sesId, estId, cambios) { const n = Object.assign(nota(sesId, estId), cambios, { sesId, estId }); dbPut('nota', sesId + '|' + estId, n); return n; }
function eliminarSesion(sesId) {
  notasDeSesion(sesId).forEach(n => dbDel('nota', sesId + '|' + n.estId));
  dbDel('ses', sesId);
}
function notasDeSesion(sesId) { return dbList('nota').filter(n => n.sesId === sesId); }

/* =====================================================================
   REGLAS DE CALIFICACIÓN
   1) Lista de cotejo: Sí = A, No = C. Rúbrica: AD, A, B o C por criterio.
      Se promedian los criterios (AD=4, A=3, B=2, C=1): ≥3.5 AD, ≥2.5 A, ≥1.5 B, menos C.
   2) Participación: si logró (A o AD) y la mayoría de sus participaciones son AD → AD.
      Si no logró (B o C) pero participó bastante (≥12) y la mayoría fue AD, A o B → B.
   3) Conducta C ese día: 2.° y 5.° grado: AD→B, A→B, B→C. Otros grados: → C.
   4) Falta injustificada = C. Falta justificada: no cuenta hasta recuperar la nota.
   ===================================================================== */
function calcularNivelClase(ses, estId, extra) {
  const est = (extra && extra.est) || dbGet('est', estId);
  if (!est) return { lv: null, estado: 'nd' };
  const e = Object.assign({ id: estId }, est);
  if (!estMatriculado(e, ses.fecha)) return { lv: null, estado: 'nomat' };
  const a = asistencia(ses.aulaId, ses.fecha, estId);
  const n = (extra && extra.nota) || nota(ses.id, estId);
  if (a.e === 'F') { const pc = {}; capsDe(ses).forEach(k => pc[k] = 'C'); return { lv: 'C', estado: 'falta', base: 'C', porCap: pc }; }
  if (a.e === 'J' && !n.rec) return { lv: null, estado: 'justificada', porCap: {} };
  const valores = []; const porCapV = {};
  (ses.crit || []).forEach((_, i) => {
    const v = n.c[i]; let x = null;

}

}

async function verificarPatron() {

}

  opts = opts || {};

  if (!navigator.onLine) { avisarCambio(); return { ok: false, motivo: 'offline' }; }
  SYNC.enCurso = true; avisarCambio();
  await idbVaciar();
  const claves = Array.from(DB.sucios);
  const cambios = claves.map(k => { const r = DB.recs.get(k); return { k, t: r.t, dev: r.dev, v: r.v, d: r.d }; });
  const correo = (DB.meta.colaCorreo || []).slice(0, 10);

  try {

    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Error del respaldo');
    if (j.epocaCambio) {
      // Se reinició el registro desde otro equipo: se descarta lo local y se vuelve a cargar
      await dbBorrarTodo([]);
      DB.meta.epoca = j.epoca; DB.meta.since = 0; DB.meta.colaCorreo = [];

    }
    claves.forEach(k => { const r2 = DB.recs.get(k); const env = cambios.find(x => x.k === k); if (r2 && env && r2.t === env.t) DB.sucios.delete(k); });
    dbFusionar(j.recs || [], false);
    DB.meta.since = j.ahora; DB.meta.epoca = j.epoca; DB.meta.ultimaSync = Date.now();
    if (j.enviados && j.enviados.length) {

      j.enviados.forEach(id => (id.split(',')).forEach(cid => { const cit = dbGet('cit', cid); if (cit && !cit.enviada) dbPut('cit', cid, Object.assign({}, cit, { enviada: Date.now() })); }));

    SYNC.enCurso = false; avisarCambio();
    if (DB.sucios.size || (DB.meta.colaCorreo || []).length) programarSync(1500);
    return { ok: true, respuesta: j };
  } catch (e) {
    SYNC.error = e.message || String(e); SYNC.enCurso = false; avisarCambio();
    return { ok: false, motivo: SYNC.error };
  }
}

/* ---------- Rutas ---------- */
function rutaActual() {
  const h = location.hash.replace(/^#\/?/, '');
  const [camino, qs] = h.split('?');
  const params = {}; (qs || '').split('&').filter(Boolean).forEach(p => { const [k, v] = p.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { partes: camino.split('/').filter(Boolean), params };
}
const VISTAS = {};
function render(opts) {
  opts = opts || {};
  const app = document.getElementById('app');
  const { partes, params } = rutaActual();
  UI.ruta = partes; UI.params = params;
  const clave = location.hash;
  const nueva = clave !== UI.ultimaRuta; UI.ultimaRuta = clave;
  const scroll = window.scrollY;
  let html;
  if (!UI.sesionAbierta) html = vistaIngreso();
  else {
    const v = VISTAS[partes[0] || 'inicio'] || VISTAS.inicio;
    try { html = v(partes, params); } catch (e) { console.error(e); html = cabecera({ atras: '#/' }) + '<main class="pag"><div class="aviso rojo">Ocurrió un error al mostrar esta pantalla: ' + esc(e.message) + '</div></main>'; }
  }
  app.innerHTML = html;
  if (nueva && !opts.mantener) {
    window.scrollTo(0, 0);
    const f = app.querySelector('[data-foco]');
    if (f) setTimeout(() => f.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
  } else window.scrollTo(0, scroll);
  if (UI.despues) { const f = UI.despues; UI.despues = null; f(); }
}
function ir(h) { if (location.hash === h) render(); else location.hash = h; }

VISTAS.inicio = () => {
  const lista = aulas(); const f = hoy(); const bim = bimestreDe(f);

  const aulasHtml = lista.map(a => {
    const n = estudiantes(a.id).length;
    const cits = citaciones(c => c.aulaId === a.id && c.cita >= f).length;
    const sesHoy = sesionesAula(a.id, bim).filter(s => s.fecha === f);
    const alerta = cits ? '<span class="al" style="color:var(--peligro)">' + cits + ' citación' + (cits > 1 ? 'es' : '') + '</span>' : sesHoy.length ? '<span class="al" style="color:var(--acento)">Hoy: clase ' + numeroClase(sesHoy[0]) + '</span>' : '<span class="al muted">Al día</span>';
    return '<a class="aula-btn" href="#/aula/' + a.id + '" style="text-decoration:none;color:inherit"><span class="muted peq">' + esc(a.grado) + '.° de secundaria</span><span class="cod">' + esc(a.grado + a.seccion) + '</span><span class="peq">' + n + ' estudiantes</span>' + alerta + '</a>';
  }).join('');
  const bims = bimestres();
  const aviso = (!lista.length ? '<div class="aviso">Aún no tienes secciones. Agrégalas en <a href="#/ajustes/secciones">Ajustes › Grados y secciones</a>.</div>' : '') +
    (bims.some(b => b.sugerido) ? '<div class="aviso">Revisa las <a href="#/ajustes/bimestres">fechas de los bimestres</a>: están puestas de forma aproximada.</div>' : '') +
    (!syncConfig() ? '<div class="aviso">Tus datos se guardan solo en este equipo. Configura el <a href="#/ajustes/respaldo">respaldo en Google Drive</a> para no perder nada y verlo en la laptop.</div>' : '');
  return cabecera({ der: '<button class="btn-borde" data-act="salir">Salir</button>' }) +
    '<main class="pag"><div><div class="muted" style="font-size:17px">' + esc(fechaLarga(f).replace(/^./, m => m.toUpperCase())) + ' · ' + romano(bim) + ' Bimestre</div><h1 class="titulo-pag" style="margin-top:6px">¿Con qué sección trabajas hoy?</h1></div>' +

/* ---------- Dentro de una sección ---------- */
VISTAS.aula = (p) => {

  if (sub === 'registros') return vistaRegistros(aulaId, p[3] || 'general');
  const f = hoy(); const bim = bimestreDe(f);

  const sesHoy = sesionesAula(aulaId, bim).filter(s => s.fecha === f);

    '<div class="fila" style="gap:18px;font-size:17px"><span><b style="color:var(--acento)">' + P + '</b> presentes</span><span><b style="color:var(--tarde)">' + T + '</b> tardanzas</span><span><b style="color:var(--peligro)">' + F + '</b> faltas</span><span><b style="color:var(--aviso-t)">' + J + '</b> justificadas</span><span><b style="color:var(--peligro)">' + C + '</b> conducta C</span></div>' +
    '<div class="esp" style="flex:1"></div><span class="etiqueta ' + (tomada ? 'verde' : '') + '">' + (tomada ? 'Asistencia tomada' : 'Asistencia sin tomar') + '</span></div>' +
    '<div class="grid-3">' +
    m('#/aula/' + aulaId + '/asistencia', 'Paso 1', 'Asistencia', 'Controla quién aparece en las fichas de hoy. Conducta y citaciones.', 'prim') +
    m('#/aula/' + aulaId + '/fichas/cotejo', 'Evaluar', 'Fichas de cotejo', 'Sí / No por criterio + participación.') +
    m('#/aula/' + aulaId + '/fichas/rubrica', 'Evaluar', 'Rúbricas', 'AD · A · B · C por criterio + participación.') +
    m('#/aula/' + aulaId + '/registros/general', 'Consultar', 'Registros', 'General, individual, por tema, estadísticas y mapa de calor.') +
    m('#/buscar?q=' + encodeURIComponent(a.grado + a.seccion), 'Buscar', 'Vista para padres', 'Busca un estudiante y muestra su historial completo.') +
    m('#/citaciones?aula=' + aulaId, 'Conducta', cits.length ? cits.length + ' citación' + (cits.length > 1 ? 'es' : '') + ' hoy' : 'Citaciones', cits.length ? (cits.every(c => c.enviada) ? 'Ya enviadas a tu correo.' : 'Se envían a tu correo al cerrar la clase.') : 'Historial de citaciones de la sección.', cits.length ? 'avi' : '') +
    '</div>' + (cits.length && cits.some(c => !c.enviada) ? '<button class="btn prim" data-act="cerrarClase" data-aula="' + aulaId + '" style="align-self:flex-start">Cerrar la clase de hoy y enviar citaciones</button>' : '') + '</main>';
};

/* ---------- Asistencia y conducta ---------- */
function vistaAsistencia(aulaId) {

  const filas = ests.map((e, i) => {

    return '<div class="asis-row ' + a.e + (a.cond === 'C' ? ' cC' : '') + '"><span class="num muted">' + (i + 1) + '</span><span class="fn"><b style="font-size:17px">' + esc(nombreEst(e)) + '</b>' + nota + notaC + '</span>' +
      '<span class="fila-ctrl"><span class="seg" role="group" aria-label="Asistencia">' + segA + '</span></span>' +

  }).join('');
  return cabecera({ atras: '#/aula/' + aulaId, titulo: aulaNombre(aulaId) + ' · Asistencia', der: '<label class="oculto" for="fasis">Fecha</label><input id="fasis" type="date" class="inp" style="width:auto;min-height:44px;font-size:16px" value="' + f + '" max="' + hoy() + '" data-cambio="fechaAsis" data-aula="' + aulaId + '">' }) +
    '<div class="sub"><div class="fila" style="padding:10px 16px;max-width:1400px;margin:0 auto;font-size:14px;gap:18px">' +
    '<span class="fila" style="gap:6px"><span class="lv lv-A" style="min-width:20px;height:16px;background:var(--acento)"></span>P presente: aparece en fichas</span>' +
    '<span class="fila" style="gap:6px"><span class="lv" style="min-width:20px;height:16px;background:var(--tarde)"></span>T tardanza: aparece y se evalúa</span>' +
    '<span class="fila" style="gap:6px"><span class="lv lv-C" style="min-width:20px;height:16px"></span>F falta: no aparece ese día (cuenta C)</span>' +
    '<span class="fila" style="gap:6px"><span class="lv lv-B" style="min-width:20px;height:16px"></span>J justificada: bloqueado</span>' +
    '<span class="muted">Conducta C: baja el logro del día y genera citación</span><span style="flex:1"></span>' +
    '<button class="btn chico" data-act="todosPresentes" data-aula="' + aulaId + '" data-f="' + f + '">Todos presentes</button></div></div>' +
    '<main style="max-width:1400px;margin:0 auto;padding:16px 0 80px">' + (f !== hoy() ? '<div class="aviso" style="margin:0 16px 12px">Estás viendo el ' + esc(fechaLarga(f)) + '.</div>' : '') +
    '<div style="background:var(--sup);border-radius:16px;overflow:hidden;margin:0 12px">' + (filas || '<div class="aviso" style="margin:16px">No hay estudiantes en esta sección. Agrégalos en Ajustes.</div>') + '</div>' +
    '<div class="fila" style="padding:16px"><a class="btn prim" href="#/aula/' + aulaId + '">Listo</a></div></main>';
}
CAMBIO.fechaAsis = (v, d) => { if (v) ir('#/aula/' + d.aula + '/asistencia?f=' + v); };
ACC.marcarAsis = d => { setAsistencia(d.aula, d.f, d.est, { e: d.v }); render({ mantener: true }); programarSync(); };
ACC.todosPresentes = d => {
  estudiantes(d.aula).filter(e => estMatriculado(e, d.f)).forEach(e => { const a = asistencia(d.aula, d.f, e.id); if (!dbGet('asis', asisClave(d.aula, d.f, e.id))) setAsistencia(d.aula, d.f, e.id, { e: a.e }); });

ACC.marcarCond = d => {

ACC.descCond = d => abrirDescConducta(d.aula, d.f, d.est);
function abrirDescConducta(aulaId, f, estId) {
  const e = dbGet('est', estId); const a = asistencia(aulaId, f, estId); const aula = dbGet('aula', aulaId);

ACC.descNivel = d => { const x = UI._desc; const t = document.getElementById('mtexto').value; setAsistencia(x.aulaId, x.f, x.estId, { cond: d.v, desc: t }); abrirDescConducta(x.aulaId, x.f, x.estId); render({ mantener: true }); };
ACC.descGuardar = () => { const x = UI._desc; setAsistencia(x.aulaId, x.f, x.estId, { desc: document.getElementById('mtexto').value.trim() }); cerrarModal(); render({ mantener: true }); programarSync(); };

/* ---------- Cerrar clase: citaciones al correo ---------- */
ACC.cerrarClase = async d => {
  const aulaId = d.aula; const f = d.f || hoy();
  if (d.ses) { const s = dbGet('ses', d.ses); if (s) dbPut('ses', d.ses, Object.assign({}, s, { cerrada: Date.now() })); }
  const n = await encolarCitacionesDelDia(aulaId, f);

  else if (!syncConfig()) toast('Clase cerrada. Configura el respaldo en Drive para que las citaciones lleguen a tu correo; mientras, puedes descargarlas.', 'error');
  else if (!navigator.onLine) toast('Clase cerrada. ' + n + ' citación(es) listas: se enviarán a tu correo apenas haya internet.');
  else { toast('Enviando ' + n + ' citación(es) a tu correo…'); sincronizar().then(r => { toast(r.ok ? 'Citaciones enviadas a ' + cfg().correo + '.' : 'No se pudo enviar ahora; se reintentará solo.', r.ok ? '' : 'error'); render({ mantener: true }); }); }
  ir('#/citaciones?aula=' + aulaId + '&f=' + f);
};

      '<span class="col" style="align-items:flex-end;gap:6px"><span class="etiqueta ' + (c.enviada ? 'verde' : '') + '">' + (c.enviada ? 'Enviada al correo' : (DB.meta.colaCorreo || []).some(m => m.id.split(',').includes(c.id)) ? 'En cola para el correo' : 'Por enviar') + '</span><button class="btn chico" data-act="bajarCitacion" data-id="' + c.id + '">Descargar Word</button></span></div>'; };

ACC.bajarCitaciones = d => { const f = hoy(); descargarCitaciones(citaciones(c => c.cita >= f && (!d.aula || c.aulaId === d.aula)), 'Citaciones-' + (d.aula ? aulaCodigo(d.aula) + '-' : '') + hoy() + '.docx'); };

/* ---------- 25 botones de fecha ---------- */
function vistaBotonesFecha(aulaId, tipo) {
  const f = hoy(); const bimHoy = bimestreDe(f); const bim = Number(UI.params.bim || bimHoy);
  const usadas = sesionesAula(aulaId, bim, tipo);
  const delDia = usadas.filter(s => s.fecha === f);
  let btns = usadas.map(s => '<a class="fecha-btn' + (s.fecha === f ? ' usada-hoy' : '') + '" href="#/ses/' + s.id + '" style="text-decoration:none;color:inherit"' + (s.fecha === f ? ' data-foco' : '') + '><b>Clase ' + numeroClase(s) + '</b><span>' + fechaCorta(s.fecha) + ' · ' + esc(s.temaId && dbGet('tema', s.temaId) ? dbGet('tema', s.temaId).nombre : 'Ver / corregir') + '</span></a>');
  let foco = !delDia.length;
  if (bim === bimHoy) {
    for (let k = delDia.length + 1; k <= 2 && btns.length < maxBotones(bim); k++) {
      btns.push('<button class="fecha-btn ' + (k === 1 ? 'hoy' : 'hoy2') + '" data-act="nuevaSesion" data-aula="' + aulaId + '" data-tipo="' + tipo + '"' + (foco ? ' data-foco' : '') + '><b>' + (k === 1 ? 'Hoy' : 'Segunda ficha') + '</b><span>' + fechaCorta(f) + ' · ' + (k === 1 ? 'Abrir ficha' : 'Si hoy das dos clases') + '</span></button>');

  }
  while (btns.length < maxBotones(bim)) btns.push('<button class="fecha-btn bloq" disabled><b>Bloqueada</b><span>Se habilita en otra fecha</span></button>');
  const nombre = tipo === 'cotejo' ? 'Fichas de cotejo' : 'Rúbricas';
  return cabecera({ atras: '#/aula/' + aulaId, titulo: aulaNombre(aulaId) + ' · ' + nombre, sub: usadas.length + ' de ' + maxBotones(bim) + ' usadas · ' + romano(bim) + ' Bimestre' }) +
    '<div class="sub"><nav class="tabs">' + [1, 2, 3, 4].map(n => '<a href="#/aula/' + aulaId + '/fichas/' + tipo + '?bim=' + n + '" class="' + (n === bim ? 'act' : '') + '">' + romano(n) + ' Bimestre</a>').join('') +
    '<a href="#/aula/' + aulaId + '/fichas/' + (tipo === 'cotejo' ? 'rubrica' : 'cotejo') + '" style="margin-left:auto">Ir a ' + (tipo === 'cotejo' ? 'Rúbricas' : 'Fichas de cotejo') + '</a></nav></div>' +

    (bim !== bimHoy ? '<div class="aviso">Estás viendo el ' + romano(bim) + ' Bimestre: solo puedes abrir las fichas ya usadas.</div>' : '') +
    (usadas.length >= maxBotones(bim) && bim === bimHoy && delDia.length < 2 ? '<div class="aviso">Ya usaste los ' + maxBotones(bim) + ' botones de este bimestre. Puedes aumentarlos en Ajustes › Fechas de bimestres.</div>' : '') +
    '<div class="grid-fechas">' + btns.join('') + '</div></main>';
}

function columnas(filas, claves) {

    const f = filas[r].map(norm); const idx = {};
    Object.keys(claves).forEach(k => { const i = f.findIndex(c => claves[k].some(p => c.startsWith(p))); if (i >= 0) idx[k] = i; });
    if (Object.keys(idx).length >= Object.keys(claves).length - 2) return { r, idx };
  }

}
function compDeTexto(t) { t = norm(t); return t.includes('oral') ? 'O' : t.startsWith('lee') || t.includes('lee ') ? 'L' : t.startsWith('escrib') || t.includes('escribe') ? 'E' : null; }
function capDeTexto(t, comp) {
  const n = norm(t).replace(/[.]/g, '').trim(); if (!n) return null;
  const lista = comp ? COMP[comp].caps : Object.values(CAP);
  let k = lista.find(c => norm(c.nombre).replace(/[.]/g, '') === n) || lista.find(c => norm(c.nombre).startsWith(n.slice(0, 22)) || n.startsWith(norm(c.nombre).slice(0, 22)));
  if (!k && comp) return capDeTexto(t, null);

}

CAMBIO.importarTemario = async (v, d, el) => {
  const f = el.files[0]; el.value = ''; if (!f) return;
  let filas; try { filas = await XL.leer(f, 'Temario'); } catch (e) { toast('No se pudo leer el archivo: ' + e.message, 'error'); return; }
  const c = columnas(filas, { grado: ['grado'], bim: ['bimestre'], unidad: ['unidad'], n: ['n', 'nro', 'sesion'], tema: ['tema', 'titulo'], prop: ['proposito'], prod: ['producto'], comp: ['competencia'], cap: ['capacidad'], crit: ['criterio'] });
  if (!c || c.idx.tema == null || c.idx.crit == null) { toast('No encontré las columnas Tema y Criterio en la primera hoja.', 'error'); return; }
  const I = c.idx; const grupos = new Map(); const errores = [];
  filas.slice(c.r + 1).forEach((fl, k) => {
    const tema = String(fl[I.tema] || '').trim(); const crit = String(fl[I.crit] || '').trim(); if (!tema) return;
    const grado = gradoDe(fl[I.grado]); const bim = bimDe(fl[I.bim]);
    if (!grado || !bim) { errores.push('Fila ' + (c.r + k + 2) + ': falta grado o bimestre'); return; }
    const comp = compDeTexto(fl[I.comp] || '');
    const cap = capDeTexto(fl[I.cap] || '', comp);
    if (crit && !cap) { errores.push('Fila ' + (c.r + k + 2) + ': no reconozco la capacidad «' + fl[I.cap] + '»'); return; }
    const key = grado + '|' + bim + '|' + norm(tema);
    if (!grupos.has(key)) grupos.set(key, { grado, bim, unidad: I.unidad != null ? String(fl[I.unidad] || '').trim() : '', nombre: tema, proposito: String(fl[I.prop] || '').trim(), producto: String(fl[I.prod] || '').trim(), orden: Number(fl[I.n]) || grupos.size + 1, crit: [], critCap: [] });

  render();

  const id = x.id || uid(); const previo = x.id ? Object.assign({ id }, dbGet('tema', id)) : null;

  v.critCap = v.crit.map(t => { if (!previo) return cap; const i = (previo.crit || []).findIndex(y => norm(y) === norm(t)); return i >= 0 ? capDe(previo, i) : cap; });
  dbPut('tema', id, Object.assign({}, previo || {}, v));
  cerrarModal(); programarSync();
  if (x.ses) { ACC.ponerTema({ ses: x.ses, tema: id }); return; }

};

    ['Was / were: then and now', 'O', 'O3', 'Describe cómo era su barrio antes y ahora', 'Exposición oral breve', ['Pronuncia con claridad', 'Organiza sus ideas en secuencia', 'Usa vocabulario del tema']],
    ['Writing a short biography', 'E', 'E1', 'Escribe una biografía breve de un personaje', 'Biografía de 80 palabras', ['Adecúa el texto al propósito', 'Incluye datos relevantes', 'Usa el pasado simple']]
  ];
  ['2', '3'].forEach(g => temasDemo.forEach((t, i) => dbPut('tema', 'demo-t' + g + i, { grado: g, bim: 4, nombre: t[0], comp: t[1], cap: t[2], proposito: t[3], producto: t[4], crit: t[5], orden: i })));
  // Clases pasadas de 2.° A y 3.° A

  window.addEventListener('online', () => { refrescarEstado(); programarSync(500); });
  window.addEventListener('offline', () => refrescarEstado());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { UI.oculto = Date.now(); idbVaciar(); }
    else {
      if (UI.sesionAbierta && UI.oculto && Date.now() - UI.oculto > 15 * 60000) { UI.sesionAbierta = false; render(); }
      UI.oculto = null;
      if (UI.sesionAbierta) traerCambios();
    }
  });
  window.addEventListener('pagehide', () => idbVaciar());
  setInterval(() => { if (UI.sesionAbierta && !document.hidden) traerCambios(); }, 60000);
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai') && !location.hostname.endsWith('claudeusercontent.com')) {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { }
  }
}

}
